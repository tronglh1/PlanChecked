name: Android release

on:
  workflow_dispatch:
    inputs:
      require_signing:
        description: 'Fail if signing secrets are missing (use for Play uploads)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # Tag builds are release builds: signing is mandatory.
      REQUIRE_SIGNING: ${{ github.event_name == 'push' || inputs.require_signing }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Check required config
        run: |
          missing=0
          for v in SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is empty"; missing=1; fi
          done
          if [ "$REQUIRE_SIGNING" = "true" ]; then
            for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "${!v}" ]; then echo "::error::Secret $v is empty (signing required)"; missing=1; fi
            done
          fi
          exit $missing

      - name: Set up release signing (if secrets present)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "storeFile=release.keystore"
            } > android/key.properties
            echo "Release keystore configured."
          else
            echo "::warning::No signing secrets: artifacts are debug-signed and NOT uploadable to Play."
          fi

      - name: Firebase config (optional)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written (push enabled)."
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set: build without push notifications."
          fi

      - name: Write dart-define file
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL:$url, SUPABASE_ANON_KEY:$key}' > env/ci.json

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build AAB (Play Store)
        run: flutter build appbundle --release --dart-define-from-file=env/ci.json

      - name: Build APK (sideload / testers)
        run: flutter build apk --release --dart-define-from-file=env/ci.json

      - name: Remove secrets from the workspace
        if: always()
        run: rm -f env/ci.json android/key.properties android/app/release.keystore android/app/google-services.json

      - uses: actions/upload-artifact@v4
        with:
          name: vuon-nha-android-${{ github.ref_name }}
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # R8 mapping: keep it to deobfuscate crashes; also upload mapping.txt to
      # Play Console (App bundle explorer > Downloads > Assets) for each release.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vuon-nha-mapping-${{ github.ref_name }}
          path: app/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90
