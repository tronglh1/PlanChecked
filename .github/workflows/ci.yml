name: CI
on:
  push:
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    # Verifies the Gradle/R8 release configuration on every push without secrets.
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: echo '{"SUPABASE_URL":"https://example.supabase.co","SUPABASE_ANON_KEY":"ci-placeholder"}' > env/ci.json
      - run: flutter build apk --release --dart-define-from-file=env/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
