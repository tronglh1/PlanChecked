# Supabase CLI config for Vườn Nhà. Region (Singapore) is chosen when the hosted project is created.
project_id = "vuon-nha"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
# Generated by seed/build.mjs; run order matters (codes before plants).
sql_paths = ["./seed/01_codes.sql", "./seed/02_text_templates.sql", "./seed/03_plants.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "https://vuonnha.app"
additional_redirect_urls = ["io.supabase.vuonnha://login-callback/", "com.planchecked.vuonnha://login-callback", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Email OTP login ("Nhận mã đăng nhập"): 6 digit code valid for 1 hour.
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"

# Google OAuth. Client id/secret come from env (see docs/backend.md).
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"
skip_nonce_check = true # native Google Sign-In (ID token) on Android

# Custom SMTP is configured in the hosted dashboard (see docs/backend.md); locally mails land in Inbucket.
[inbucket]
enabled = true
port = 54324

# Edge Functions verify the JWT themselves (supports asymmetric JWT signing keys), see _shared/auth.ts.
[functions.ai-plan]
verify_jwt = false
[functions.ai-checkin]
verify_jwt = false
[functions.invite]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
[functions.send-push]
verify_jwt = false
